[project]
name = "central-de-salas-mcp"
version = "1.0.0"
description = "Servidor MCP (Streamable HTTP) das salas da Hill Valley Tech"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "uvicorn==0.54.0",
    "pydantic==2.12.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["servidor"]
